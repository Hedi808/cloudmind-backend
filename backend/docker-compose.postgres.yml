services:
  cloudmind-postgres:
    image: postgres:16
    container_name: cloudmind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cloudmind
      POSTGRES_USER: cloudmind
      POSTGRES_PASSWORD: cloudmind_password
    ports:
      - "5432:5432"
    volumes:
      - cloudmind_postgres_data:/var/lib/postgresql/data

volumes:
  cloudmind_postgres_data: